name: Cross-post to Dev.to

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'   # only runs when a blog post is added or edited
  workflow_dispatch:        # allow manual trigger from the Actions tab

permissions:
  contents: write           # needed to commit the updated tracking file

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cross-post to Dev.to
        run: node scripts/crosspost-devto.mjs
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}

      - name: Commit updated tracking file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .devto-articles.json
          git diff --cached --quiet || git commit -m "chore: update Dev.to article tracking [skip ci]"
          git push
