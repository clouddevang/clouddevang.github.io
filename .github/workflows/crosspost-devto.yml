name: Cross-post to Dev.to

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'   # only runs when a blog post is added or edited
  workflow_dispatch:        # allow manual trigger from the Actions tab

permissions:
  contents: read            # read-only — no push to protected main needed

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore tracking cache
        uses: actions/cache@v4
        with:
          path: .devto-articles.json
          key: devto-tracking-${{ github.run_id }}
          restore-keys: devto-tracking-   # always restores latest cache entry

      - name: Install dependencies
        run: npm ci

      - name: Cross-post to Dev.to
        run: node scripts/crosspost-devto.mjs
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}

      # Tracking file is saved in the Actions cache above — no git push needed.
      # On every run the script also fetches existing Dev.to articles by
      # canonical_url, so deduplication works even with a cold cache.
